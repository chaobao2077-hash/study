<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>单词储蓄罐</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fbfaf4}#app{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="app" src="./app.html" title="单词储蓄罐"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  const win=frame.contentWindow,doc=frame.contentDocument;
  if(!win||!doc)return;

  const SETTINGS_KEY='word-piggy-bank-settings-v4';
  const SYNC_KEY='word-piggy-bank-sync-key-v1';
  const WORDS_KEY='word-piggy-bank-v1';
  const STATS_KEY='word-piggy-bank-stats-v1';
  const IMAGE_MAP_KEY='word-piggy-bank-image-map-v1';
  const defaults={showImages:false,pexelsKey:'',weightedPractice:true};
  const loadJSON=(k,f)=>{try{return JSON.parse(localStorage.getItem(k)||'')||f}catch{return f}};
  const loadSettings=()=>({...defaults,...loadJSON(SETTINGS_KEY,{})});
  let settings=loadSettings();
  const saveSettings=()=>localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));
  let imageMap=loadJSON(IMAGE_MAP_KEY,{});
  const saveImageMap=()=>{try{localStorage.setItem(IMAGE_MAP_KEY,JSON.stringify(imageMap))}catch{}};

  const style=doc.createElement('style');
  style.textContent=`
    #wordList .word-main{cursor:pointer;border-radius:9px;transition:.15s ease}
    #wordList .word-main:hover,#wordList .word-main:focus-visible{background:var(--mint);outline:none}
    #wordList .word-main b::after{content:'  🔊';font-family:system-ui,sans-serif;font-size:.78rem;opacity:.55}
    .choice[data-review-ready="1"]{cursor:pointer}.choice[data-review-ready="1"]:active{transform:scale(.99)}
    .study-settings-btn{position:fixed;right:14px;top:14px;z-index:9999;border:1px solid var(--line);background:rgba(255,255,255,.96);color:var(--ink);border-radius:999px;padding:9px 12px;font-weight:800;box-shadow:0 8px 20px rgba(25,54,54,.13)}
    .study-settings-backdrop{position:fixed;inset:0;z-index:10000;background:rgba(20,40,40,.38);display:none;align-items:center;justify-content:center;padding:18px}.study-settings-backdrop.open{display:flex}
    .study-settings{width:min(520px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:22px;padding:22px;box-shadow:0 24px 60px rgba(20,40,40,.28);color:var(--ink)}
    .study-settings h3{margin:0 0 4px;font-size:1.2rem}.study-settings p{margin:0;color:var(--muted);font-size:.82rem;line-height:1.5}
    .setting-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid var(--line)}.setting-row:last-child{border-bottom:0}.setting-row strong{display:block;margin-bottom:3px}.setting-row small{display:block;color:var(--muted);line-height:1.4}
    .setting-input{width:100%;margin-top:9px;border:1px solid var(--line);border-radius:11px;padding:10px 11px}
    .switch{position:relative;width:46px;height:27px;flex:0 0 auto}.switch input{display:none}.switch i{position:absolute;inset:0;border-radius:99px;background:#dce7e2;transition:.2s}.switch i:after{content:'';position:absolute;width:21px;height:21px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.18);transition:.2s}.switch input:checked+i{background:#2ca67b}.switch input:checked+i:after{transform:translateX(19px)}
    .settings-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.settings-actions button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:10px 12px;font-weight:800}.settings-actions .primary-mini{background:var(--ink);color:#fff;border-color:var(--ink)}
    .sync-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.73rem;word-break:break-all;background:#f6f8f7;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;user-select:all}
    .memory .picture{position:relative!important;overflow:hidden!important;background:linear-gradient(145deg,var(--mint),#fff5c9)!important}.memory .picture>img,.memory .picture>.picture-fallback{display:none!important}
    .semantic-card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px;color:var(--ink);background:linear-gradient(145deg,var(--mint),#fff5c9)}.semantic-card .icon{font-size:2.4rem;line-height:1;margin-bottom:7px}.semantic-card b{font:700 1.02rem Georgia,serif}.semantic-card span{display:block;margin-top:5px;color:var(--muted);font-size:.72rem;line-height:1.35;word-break:break-word}
    .study-photo{position:absolute;inset:0;width:100%!important;height:100%!important;object-fit:cover!important;display:block!important}.photo-credit{position:absolute;right:6px;bottom:6px;background:rgba(25,54,54,.78);color:#fff;border-radius:999px;padding:3px 7px;font-size:.58rem}.memory-actions{position:relative;z-index:5}
    @media(max-width:520px){.study-settings-btn{top:9px;right:9px;padding:8px 10px}.study-settings{padding:18px}}
  `;
  doc.head.appendChild(style);

  function randomKey(){const bytes=new Uint8Array(24);crypto.getRandomValues(bytes);return Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('')}
  let syncKey=localStorage.getItem(SYNC_KEY);if(!syncKey){syncKey=randomKey();localStorage.setItem(SYNC_KEY,syncKey)}

  function bestUSVoice(){
    const voices=win.speechSynthesis?.getVoices?.()||[];
    const us=voices.filter(v=>/^en-US/i.test(v.lang));
    const preferred=['Samantha','Ava','Allison','Susan','Joelle','Evan','Alex'];
    return preferred.map(n=>us.find(v=>v.name.includes(n))).find(Boolean)||us.find(v=>v.localService)||us[0]||voices.find(v=>/^en/i.test(v.lang))||null;
  }
  function speakText(text){
    const word=String(text||'').trim(); if(!word||!('speechSynthesis' in win))return;
    win.speechSynthesis.cancel(); const u=new win.SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=.9;u.pitch=1;
    const voice=bestUSVoice();if(voice)u.voice=voice;win.speechSynthesis.speak(u);
  }
  win.speechSynthesis?.getVoices?.();

  const enhanceWords=()=>doc.querySelectorAll('#wordList .word-main').forEach(el=>{if(el.dataset.speakReady)return;el.dataset.speakReady='1';el.setAttribute('role','button');el.tabIndex=0;const word=el.querySelector('b')?.textContent?.trim()||'';el.title=word?`点击朗读 ${word}`:'点击朗读';el.setAttribute('aria-label',word?`朗读 ${word}`:'朗读单词')});
  doc.addEventListener('click',e=>{
    const wordMain=e.target.closest?.('#wordList .word-main');if(wordMain){speakText(wordMain.querySelector('b')?.textContent);return}
    const choice=e.target.closest?.('.choice[data-review-ready="1"]');if(choice)speakText(choice.dataset.value||choice.textContent.replace(/^[A-D]\s*/,''));
  });
  doc.addEventListener('keydown',e=>{const el=e.target.closest?.('#wordList .word-main');if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();speakText(el.querySelector('b')?.textContent)}});
  const originalSpeakWord=win.speakWord;win.speakWord=function(){const word=doc.querySelector('.memory .memory-head h3 span')?.textContent?.trim()||'';if(word&&/[a-z]/i.test(word))speakText(word);else if(typeof originalSpeakWord==='function')originalSpeakWord()};

  function readWords(){const x=loadJSON(WORDS_KEY,[]);return Array.isArray(x)?x:[]}
  function weightedIndex(words){if(!words.length)return 0;const weights=words.map(w=>{const m=Math.max(0,Math.min(100,Number(w.mastery)||0)),u=(100-m)/100;return .06+Math.pow(u,2)});let r=Math.random()*weights.reduce((a,b)=>a+b,0);for(let i=0;i<weights.length;i++){r-=weights[i];if(r<=0)return i}return words.length-1}
  function cleanMeaning(m){return String(m||'').replace(/\b(?:n|v|vt|vi|adj|adv|prep|conj)\.\s*/gi,'').split(/[；;]/)[0].trim()}
  function imageKey(item){return `${String(item?.word||'').toLowerCase()}|${cleanMeaning(item?.meaning||'')}`}
  function withTimeout(promise,ms){return Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')),ms))])}
  const inFlight=new Map();
  const imageControllers=new Set();
  const preloadImages=new Set();
  let imageGeneration=0;
  function stopAllImageLoading(){
    imageGeneration += 1;
    imageControllers.forEach(c=>{try{c.abort()}catch{}});
    imageControllers.clear();
    preloadImages.forEach(img=>{try{img.onload=img.onerror=null;img.src=''}catch{}});
    preloadImages.clear();
    inFlight.clear();
  }
  function preloadURL(url,generation=imageGeneration){return new Promise(resolve=>{
    if(!settings.showImages||!url||generation!==imageGeneration)return resolve(false);
    const img=new Image();preloadImages.add(img);img.decoding='async';
    const done=v=>{preloadImages.delete(img);resolve(v)};
    img.onload=()=>done(settings.showImages&&generation===imageGeneration);
    img.onerror=()=>done(false);
    img.src=url;
  })}
  async function searchPexels(item){
    if(!settings.showImages||!settings.pexelsKey||!item)return null;
    const zh=cleanMeaning(item.meaning),attempts=[{q:zh||item.word,locale:'zh-CN'},{q:`${item.word} ${zh}`.trim(),locale:'en-US'},{q:item.word,locale:'en-US'}];
    for(const a of attempts){
      try{
        const url=`https://api.pexels.com/v1/search?query=${encodeURIComponent(a.q)}&per_page=1&orientation=landscape&locale=${a.locale}`;
        const controller=new AbortController();imageControllers.add(controller);
        const r=await withTimeout(win.fetch(url,{headers:{Authorization:settings.pexelsKey},cache:'no-store',signal:controller.signal}),2200);
        imageControllers.delete(controller);
        if(!settings.showImages)return null;
        if(!r.ok)continue;const data=await r.json();const p=data?.photos?.[0];const src=p?.src?.large||p?.src?.medium;if(src)return {src,source:'Pexels'};
      }catch{}
    }
    return null;
  }
  async function prepareImage(item){
    if(!item||!settings.showImages)return null;
    const generation=imageGeneration;
    const k=imageKey(item); if(!k||generation!==imageGeneration)return null;
    const cached=imageMap[k];
    if(cached?.src){if(settings.showImages)preloadURL(cached.src,generation);return settings.showImages?cached:null}
    if(inFlight.has(k))return inFlight.get(k);
    const task=(async()=>{
      const found=await searchPexels(item);
      if(!settings.showImages||generation!==imageGeneration)return null;
      if(found){imageMap[k]={...found,ts:Date.now()};saveImageMap();await preloadURL(found.src,generation);return (settings.showImages&&generation===imageGeneration)?found:null}
      return null;
    })().finally(()=>inFlight.delete(k));
    inFlight.set(k,task); return task;
  }
  function peekPrepared(item){return item?imageMap[imageKey(item)]||null:null}

  let activeItem=null;
  const originalStartQuiz=win.startQuiz;
  if(typeof originalStartQuiz==='function'){
    win.startQuiz=function(...args){
      const words=readWords();
      if(!words.length)return originalStartQuiz.apply(this,args);
      const idx=settings.weightedPractice?weightedIndex(words):Math.floor(Math.random()*words.length);
      activeItem=words[idx]||null;
      const realRandom=win.Math.random;let first=true;
      win.Math.random=()=>{if(first){first=false;return Math.min(.999999,(idx+.25)/words.length)}return realRandom()};
      try{return originalStartQuiz.apply(this,args)}finally{
        win.Math.random=realRandom;
        if(settings.showImages)setTimeout(()=>{if(settings.showImages)prepareImage(activeItem)},0);
      }
    };
  }

  function emojiFor(word,meaning){const t=`${word} ${meaning}`.toLowerCase(),rules=[[/苹果|水果|fruit|apple/,'🍎'],[/狗|猫|动物|animal|dog|cat/,'🐾'],[/树|花|植物|plant|tree|flower/,'🌿'],[/车|交通|car|vehicle/,'🚗'],[/书|学习|阅读|book|study|read/,'📚'],[/钱|银行|金融|money|bank|finance/,'💰'],[/时间|time/,'⏰'],[/焦虑|害怕|情绪|anxiety|fear|emotion/,'💭']];return rules.find(([re])=>re.test(t))?.[1]||'🧠'}
  function addSemantic(tile,word,meaning,label){if(!tile)return;tile.replaceChildren();const card=doc.createElement('div');card.className='semantic-card';const i=doc.createElement('div');i.className='icon';i.textContent=emojiFor(word,meaning);const b=doc.createElement('b');b.textContent=label||word;const s=doc.createElement('span');s.textContent=meaning||'记住这个词义';card.append(i,b,s);tile.appendChild(card)}
  function applyPhoto(tile,photo,word,meaning){if(!tile||!photo?.src)return false;tile.replaceChildren();const img=doc.createElement('img');img.className='study-photo';img.src=photo.src;img.alt=`${word} 相关图片`;img.loading='eager';img.decoding='async';img.onerror=()=>addSemantic(tile,word,meaning,word);const credit=doc.createElement('span');credit.className='photo-credit';credit.textContent=photo.source||'图片';tile.append(img,credit);return true}
  function renderMemoryVisuals(memory){
    if(!memory||memory.dataset.visualReady==='1')return;
    memory.dataset.visualReady='1';
    const tiles=[...memory.querySelectorAll('.pictures .picture')];if(!tiles.length)return;
    const word=memory.querySelector('.memory-head h3 span')?.textContent?.trim()||activeItem?.word||'';
    const heading=memory.querySelector('.memory-head h3')?.textContent||'';
    const meaning=heading.includes('=')?heading.slice(heading.indexOf('=')+1).trim():(activeItem?.meaning||'');
    const example=memory.querySelector('.memory-tip strong')?.textContent?.trim()||activeItem?.example||'';
    tiles.forEach((t,i)=>addSemantic(t,word,meaning,i===0?word:(i===1?'例句场景':'三步记忆')));
    if(tiles[1])tiles[1].querySelector('span').textContent=example&&example!==word?example:`试着用 ${word} 造一个简单句`;
    if(tiles[2])tiles[2].querySelector('span').textContent='英文 → 中文义 → 例句';
    if(!settings.showImages)return;
    const prepared=peekPrepared(activeItem||{word,meaning});
    if(prepared)applyPhoto(tiles[0],prepared,word,meaning);
  }

  const quizBody=doc.getElementById('quizBody');
  let choicePassScheduled=false;
  const processQuiz=()=>{
    choicePassScheduled=false;
    doc.querySelectorAll('.choice:disabled').forEach(btn=>{
      if((btn.classList.contains('correct')||btn.classList.contains('wrong'))&&btn.dataset.reviewReady!=='1'){
        btn.disabled=false;btn.dataset.reviewReady='1';btn.title='再点一次可听美式发音';
      }
    });
    const memory=doc.querySelector('.memory');if(memory&&memory.dataset.visualReady!=='1')renderMemoryVisuals(memory);
  };
  const quizObserver=new win.MutationObserver(()=>{if(!choicePassScheduled){choicePassScheduled=true;win.requestAnimationFrame(processQuiz)}});
  if(quizBody)quizObserver.observe(quizBody,{childList:true,subtree:true,attributes:true,attributeFilter:['disabled','class']});

  function makeSettings(){
    const btn=doc.createElement('button');btn.className='study-settings-btn';btn.type='button';btn.textContent='⚙️ 设置';
    const back=doc.createElement('div');back.className='study-settings-backdrop';
    back.innerHTML=`<div class="study-settings" role="dialog" aria-modal="true"><h3>学习设置</h3><p>图片设置、Pexels Key 和同步密钥只保存在当前浏览器。</p><div class="setting-row"><div><strong>掌握度加权抽题</strong><small>掌握度越高，被抽到的概率越低，但不会完全消失。</small></div><label class="switch"><input id="weightedToggle" type="checkbox"><i></i></label></div><div class="setting-row"><div style="flex:1"><strong>答错时显示图片</strong><small>出题时就后台预加载；答错时不等待网络。关闭后完全停止图片请求。</small><input id="pexelsKeyInput" class="setting-input" type="password" placeholder="Pexels API Key（仅保存在此设备）"></div><label class="switch"><input id="imageToggle" type="checkbox"><i></i></label></div><div class="setting-row"><div style="flex:1"><strong>学习同步密钥</strong><small>目前用于识别和迁移进度；自动云同步仍需要后端。</small><div class="sync-code" id="syncCode"></div></div></div><div class="settings-actions"><button id="copyKeyBtn">复制密钥</button><button id="exportBtn">复制进度包</button><button id="importBtn">导入进度包</button><button id="clearImageCacheBtn">清除图片缓存</button><button id="closeSettings" class="primary-mini">完成</button></div></div>`;
    doc.body.append(btn,back);
    const weighted=back.querySelector('#weightedToggle'),images=back.querySelector('#imageToggle'),keyInput=back.querySelector('#pexelsKeyInput');
    const refresh=()=>{settings=loadSettings();weighted.checked=!!settings.weightedPractice;images.checked=!!settings.showImages;keyInput.value=settings.pexelsKey||'';back.querySelector('#syncCode').textContent=syncKey};
    btn.onclick=()=>{refresh();back.classList.add('open')};back.querySelector('#closeSettings').onclick=()=>back.classList.remove('open');back.addEventListener('click',e=>{if(e.target===back)back.classList.remove('open')});
    weighted.onchange=()=>{settings.weightedPractice=weighted.checked;saveSettings()};
    images.onchange=()=>{
      settings.showImages=images.checked;saveSettings();
      if(!settings.showImages){stopAllImageLoading();return;}
      if(activeItem)prepareImage(activeItem);
    };
    keyInput.onchange=()=>{settings.pexelsKey=keyInput.value.trim();saveSettings();if(settings.showImages&&activeItem)prepareImage(activeItem)};
    back.querySelector('#copyKeyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(syncKey);win.showToast?.('同步密钥已复制')}catch{}};
    back.querySelector('#exportBtn').onclick=async()=>{const payload={version:2,syncKey,words:readWords(),stats:loadJSON(STATS_KEY,{}),settings:{...settings,pexelsKey:''}};try{await navigator.clipboard.writeText(JSON.stringify(payload));win.showToast?.('学习进度包已复制')}catch{}};
    back.querySelector('#importBtn').onclick=()=>{const raw=win.prompt('粘贴另一台设备导出的学习进度包：');if(!raw)return;try{const p=JSON.parse(raw);if(!Array.isArray(p.words))throw new Error();localStorage.setItem(WORDS_KEY,JSON.stringify(p.words));localStorage.setItem(STATS_KEY,JSON.stringify(p.stats||{}));if(p.syncKey){syncKey=p.syncKey;localStorage.setItem(SYNC_KEY,syncKey)}win.showToast?.('导入成功，正在刷新');setTimeout(()=>frame.src='./app.html?sync='+Date.now(),300);back.classList.remove('open')}catch{win.alert('进度包格式不正确')}};
    back.querySelector('#clearImageCacheBtn').onclick=()=>{imageMap={};saveImageMap();win.showToast?.('图片缓存已清除')};
  }

  const wordList=doc.getElementById('wordList');if(wordList){enhanceWords();new win.MutationObserver(enhanceWords).observe(wordList,{childList:true,subtree:true})}
  makeSettings();processQuiz();
});
</script>
</body>
</html>
