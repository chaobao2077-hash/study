<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="把新单词存进储蓄罐，用随机选择题和图片联想慢慢掌握它们。" />
  <title>单词储蓄罐</title>
  <link rel="preconnect" href="https://loremflickr.com" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23193636'/%3E%3Cpath d='M17 30c0-11 8-17 20-17 6 0 10 2 13 5l7-2-2 11c2 3 2 9 0 13l3 5h-9l-2-3H27l-2 3h-9l3-7c-1-2-2-5-2-8Z' fill='%23ffd166'/%3E%3Ccircle cx='45' cy='27' r='2.5' fill='%23193636'/%3E%3Cpath d='M27 13h12' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
  <style>
    :root {
      --ink: #193636;
      --muted: #6f7f7d;
      --paper: #fbfaf4;
      --card: #ffffff;
      --mint: #dff3ea;
      --mint-strong: #7dd3b0;
      --orange: #ff7c45;
      --yellow: #ffd166;
      --red: #dd4c50;
      --line: #dce7e2;
      --shadow: 0 14px 35px rgba(25, 54, 54, .10);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 10%, rgba(255, 209, 102, .34), transparent 22rem),
        radial-gradient(circle at 92% 0%, rgba(125, 211, 176, .28), transparent 24rem),
        var(--paper);
      min-height: 100vh;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .shell { max-width: 1220px; margin: 0 auto; padding: 28px 28px 50px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
    .brand { display: flex; align-items: center; gap: 13px; }
    .logo {
      width: 48px; height: 48px; border-radius: 15px; background: var(--ink); color: var(--yellow);
      display: grid; place-items: center; font-size: 25px; box-shadow: 0 8px 20px rgba(25,54,54,.18);
    }
    h1 { margin: 0; font-size: clamp(1.45rem, 3vw, 2rem); letter-spacing: -.04em; }
    .brand p { margin: 3px 0 0; color: var(--muted); font-size: .9rem; }
    .header-stats { display: flex; align-items: center; gap: 8px; }
    .stat-pill { background: rgba(255,255,255,.72); border: 1px solid var(--line); padding: 9px 14px; border-radius: 999px; font-size: .88rem; }
    .stat-pill strong { color: var(--orange); }
    main { display: grid; grid-template-columns: minmax(0, .9fr) minmax(420px, 1.15fr); gap: 22px; align-items: start; }
    .panel { background: rgba(255,255,255,.86); border: 1px solid rgba(220,231,226,.9); border-radius: 24px; box-shadow: var(--shadow); overflow: hidden; }
    .left { display: grid; gap: 18px; }
    .deposit { padding: 24px; }
    .section-kicker { margin: 0 0 5px; color: var(--orange); font-size: .78rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h2 { margin: 0; font-size: 1.28rem; letter-spacing: -.03em; }
    .subcopy { margin: 7px 0 18px; color: var(--muted); font-size: .9rem; line-height: 1.55; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
    label { display: block; font-size: .82rem; font-weight: 700; margin-bottom: 6px; }
    .field-full { grid-column: 1 / -1; }
    input { width: 100%; border: 1px solid var(--line); border-radius: 13px; padding: 12px 13px; color: var(--ink); background: #fff; outline: none; }
    input:focus { border-color: var(--mint-strong); box-shadow: 0 0 0 4px rgba(125,211,176,.2); }
    .lookup-note { min-height: 18px; margin: 5px 2px 0; color: var(--muted); font-size: .72rem; }
    .lookup-note.busy { color: #b16b26; }
    .lookup-note.ok { color: #218b68; }
    .primary { border: 0; border-radius: 13px; background: var(--ink); color: #fff; padding: 12px 18px; font-weight: 800; box-shadow: 0 8px 16px rgba(25,54,54,.16); }
    .primary:hover { transform: translateY(-1px); }
    .deposit-btn { width: 100%; margin-top: 13px; }
    .bank { padding: 21px 24px 18px; }
    .bank-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
    .count { font-size: .82rem; color: var(--muted); }
    .word-list { display: grid; gap: 10px; max-height: 350px; overflow: auto; padding-right: 3px; }
    .word-row { display: grid; grid-template-columns: minmax(0,1fr) 122px 70px; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 15px; padding: 11px 8px 11px 14px; background: #fff; }
    .word-main { min-width: 0; }
    .word-main b { display: block; font-family: Georgia, serif; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .word-main span { display: block; color: var(--muted); font-size: .78rem; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meter-wrap { display: grid; gap: 5px; }
    .meter-label { display: flex; justify-content: space-between; color: var(--muted); font-size: .7rem; }
    .meter { height: 7px; background: #edf1ee; border-radius: 99px; overflow: hidden; }
    .meter > i { display: block; height: 100%; background: linear-gradient(90deg, var(--mint-strong), #2ca67b); border-radius: inherit; transition: width .4s ease; }
    .icon-btn { border: 0; background: transparent; color: #a3aeab; border-radius: 9px; width: 32px; height: 32px; font-size: 1.05rem; }
    .icon-btn:hover { background: #fff0ec; color: var(--red); }
    .row-actions { display: flex; gap: 2px; }
    .refresh-btn:hover { background: var(--mint); color: #218b68; }
    .quiz { min-height: 622px; position: sticky; top: 20px; }
    .quiz-top { padding: 24px 26px 19px; background: var(--ink); color: #fff; display: flex; justify-content: space-between; align-items: center; }
    .quiz-top .section-kicker { color: var(--yellow); }
    .quiz-top h2 { font-size: 1.4rem; }
    .round { font-size: .78rem; color: #c5d5d2; }
    .quiz-body { padding: 28px; }
    .empty { min-height: 445px; display: grid; place-items: center; text-align: center; }
    .jar { width: 160px; height: 180px; margin: 0 auto 22px; position: relative; }
    .jar::before { content: ""; position: absolute; inset: 25px 9px 0; border: 5px solid var(--ink); border-radius: 28px 28px 48px 48px; background: linear-gradient(160deg, rgba(255,255,255,.5), var(--mint)); }
    .jar::after { content: ""; position: absolute; width: 105px; height: 22px; left: 28px; top: 13px; border: 5px solid var(--ink); border-radius: 8px; background: var(--yellow); }
    .coins { position: absolute; z-index: 2; inset: 68px 24px 22px; display: flex; flex-wrap: wrap-reverse; gap: 6px; align-content: flex-start; justify-content: center; }
    .coin { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--yellow); border: 3px solid var(--ink); font: 700 17px Georgia,serif; transform: rotate(var(--r)); }
    .empty h3 { margin: 0 0 7px; font-size: 1.25rem; }
    .empty p { color: var(--muted); margin: 0 0 19px; }
    .question-word { text-align: center; margin: 4px 0 25px; }
    .question-word small { color: var(--muted); }
    .word-line { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 8px; }
    .word-line strong { font: 700 clamp(2.4rem, 7vw, 4rem) Georgia, serif; letter-spacing: -.04em; }
    .cloze-card { margin: 0 0 20px; padding: 19px 18px; text-align: center; border-radius: 17px; background: #fff8dc; border: 1px solid #f0dc98; }
    .cloze-card strong { display: block; font-family: Georgia, serif; font-size: 1.2rem; line-height: 1.55; }
    .cloze-card span { display: block; color: var(--muted); margin-top: 7px; font-size: .83rem; }
    .sound { border: 1px solid var(--line); background: #fff; border-radius: 50%; width: 42px; height: 42px; color: var(--ink); }
    .choices { display: grid; gap: 11px; }
    .choice { width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 15px; background: #fff; color: var(--ink); padding: 15px 17px; display: flex; align-items: center; gap: 13px; font-weight: 700; transition: .15s ease; }
    .choice:hover:not(:disabled) { border-color: var(--mint-strong); transform: translateX(3px); box-shadow: 0 5px 15px rgba(25,54,54,.07); }
    .choice-letter { flex: 0 0 auto; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 9px; background: var(--mint); font-size: .8rem; }
    .choice.correct { background: #e8f8f0; border-color: #35aa7c; }
    .choice.wrong { background: #fff0ed; border-color: #e06a61; }
    .feedback { margin-top: 17px; padding: 15px; border-radius: 15px; background: var(--mint); display: flex; justify-content: space-between; align-items: center; gap: 14px; animation: pop .25s ease; }
    .feedback.error { background: #fff0ed; }
    .feedback b { display: block; }
    .feedback span { color: var(--muted); font-size: .82rem; }
    .next { border: 0; background: var(--orange); color: #fff; font-weight: 800; border-radius: 11px; padding: 11px 14px; white-space: nowrap; }
    .memory { animation: pop .3s ease; }
    .memory-head { text-align: center; margin-bottom: 18px; }
    .memory-head .oops { display: inline-block; color: var(--red); background: #fff0ed; border-radius: 999px; padding: 6px 11px; font-weight: 800; font-size: .78rem; }
    .memory-head h3 { margin: 11px 0 5px; font-size: 1.35rem; }
    .memory-head p { margin: 0; color: var(--muted); font-size: .88rem; }
    .pictures { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
    .picture { border-radius: 15px; overflow: hidden; background: var(--mint); aspect-ratio: 1 / .82; position: relative; }
    .picture img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .picture-fallback { position: absolute; inset: 0; display: none; place-items: center; font-size: 3rem; background: linear-gradient(145deg,var(--mint),#fff0bd); }
    .memory-tip { margin: 14px 0 0; background: #fff8dc; border: 1px solid #f4dc8c; border-radius: 14px; padding: 13px 15px; line-height: 1.55; }
    .memory-tip strong { font-family: Georgia, serif; }
    .memory-actions { display: flex; gap: 10px; margin-top: 15px; }
    .memory-actions button { flex: 1; }
    .secondary { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 12px; padding: 11px 14px; font-weight: 800; }
    .toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%,20px); background: var(--ink); color: #fff; border-radius: 12px; padding: 11px 17px; opacity: 0; pointer-events: none; transition: .25s ease; box-shadow: var(--shadow); z-index: 10; }
    .toast.show { opacity: 1; transform: translate(-50%,0); }
    @keyframes pop { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: scale(1); } }
    @media (max-width: 880px) {
      .shell { padding: 20px 16px 40px; }
      main { grid-template-columns: 1fr; }
      .quiz { position: static; min-height: 560px; grid-row: 1; }
      header { align-items: flex-start; }
      .header-stats { display: none; }
    }
    @media (max-width: 520px) {
      .form-grid { grid-template-columns: 1fr; }
      .field-full { grid-column: auto; }
      .quiz-body { padding: 22px 18px; }
      .pictures { grid-template-columns: 1fr 1fr; }
      .picture:last-child { display: none; }
      .word-row { grid-template-columns: minmax(0,1fr) 85px 66px; }
      .feedback { align-items: flex-start; flex-direction: column; }
      .next { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true">🐷</div>
        <div><h1>单词储蓄罐</h1><p>每天存一点，记忆会复利。</p></div>
      </div>
      <div class="header-stats" aria-label="学习统计">
        <div class="stat-pill">已存 <strong id="totalStat">0</strong> 词</div>
        <div class="stat-pill">答对 <strong id="correctStat">0</strong> 次</div>
      </div>
    </header>

    <main>
      <div class="left">
        <section class="panel deposit" aria-labelledby="depositTitle">
          <p class="section-kicker">Deposit · 存入</p>
          <h2 id="depositTitle">投一个新单词</h2>
          <p class="subcopy">输入英文即可从本地词典秒查释义，例句可以稍后补充。</p>
          <form id="wordForm">
            <div class="form-grid">
              <div><label for="wordInput">英文单词</label><input id="wordInput" name="word" placeholder="例如：serendipity" autocomplete="off" required /></div>
              <div><label for="meaningInput">中文意思（自动填写，可修改）</label><input id="meaningInput" name="meaning" placeholder="输入英文后自动出现" autocomplete="off" /><div class="lookup-note" id="lookupNote">输入英文后按 Tab 或点击别处</div></div>
              <div class="field-full"><label for="exampleInput">例句（选填）</label><input id="exampleInput" name="example" placeholder="We met by pure serendipity." autocomplete="off" /></div>
            </div>
            <button class="primary deposit-btn" id="depositButton" type="submit">＋ 存进储蓄罐</button>
          </form>
        </section>

        <section class="panel bank" aria-labelledby="bankTitle">
          <div class="bank-head">
            <div><p class="section-kicker">My Bank · 词库</p><h2 id="bankTitle">我的单词存款</h2></div>
            <span class="count" id="wordCount">0 个单词</span>
          </div>
          <div class="word-list" id="wordList"></div>
        </section>
      </div>

      <section class="panel quiz" aria-labelledby="quizTitle">
        <div class="quiz-top">
          <div><p class="section-kicker">Practice · 练习</p><h2 id="quizTitle">取一枚单词硬币</h2></div>
          <span class="round" id="roundLabel">准备开始</span>
        </div>
        <div class="quiz-body" id="quizBody"></div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const STORAGE_KEY = 'word-piggy-bank-v1';
    const STATS_KEY = 'word-piggy-bank-stats-v1';
    const seedWords = [
      { id:'seed-1', word:'curious', meaning:'好奇的', example:'She is curious about the world.', mastery:40 },
      { id:'seed-2', word:'harvest', meaning:'收获；收割', example:'Farmers harvest the wheat in autumn.', mastery:20 },
      { id:'seed-3', word:'whisper', meaning:'低声说；耳语', example:'He whispered a secret to me.', mastery:60 },
      { id:'seed-4', word:'resilient', meaning:'有韧性的；能复原的', example:'Children can be remarkably resilient.', mastery:0 },
      { id:'seed-5', word:'glimpse', meaning:'一瞥；短暂地看', example:'I caught a glimpse of the sea.', mastery:20 },
      { id:'seed-6', word:'nourish', meaning:'滋养；培养', example:'Good books nourish the mind.', mastery:40 }
    ];
    const fallbackWords = ['discover','gentle','patient','bright','imagine','protect','wander','notice'];
    const localMeanings = { curious:'好奇的', harvest:'收获；收割', whisper:'低声说；耳语', resilient:'有韧性的；能复原的', glimpse:'一瞥；短暂地看', nourish:'滋养；培养', brilliant:'出色的；明亮的', discover:'发现', gentle:'温和的', patient:'耐心的', bright:'明亮的', imagine:'想象', protect:'保护', wander:'漫步', notice:'注意到' };
    const dictionaryBuckets = new Map();
    const emojiMap = { curious:'🔎', harvest:'🌾', whisper:'🤫', resilient:'🌱', glimpse:'👀', nourish:'🥣' };
    let words = loadWords();
    let stats = loadStats();
    let current = null;
    let answered = false;
    let round = 0;

    function loadWords(){
      try { const saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); return Array.isArray(saved) ? saved : seedWords; }
      catch { return seedWords; }
    }
    function loadStats(){
      try { return { correct:0, total:0, ...JSON.parse(localStorage.getItem(STATS_KEY)) }; }
      catch { return { correct:0, total:0 }; }
    }
    function persist(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(words)); localStorage.setItem(STATS_KEY, JSON.stringify(stats)); }
    function escapeHtml(value=''){ return String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
    function shuffle(list){ return [...list].sort(() => Math.random() - .5); }
    function showToast(message){ const el=document.getElementById('toast'); el.textContent=message; el.classList.add('show'); clearTimeout(showToast.t); showToast.t=setTimeout(()=>el.classList.remove('show'),1800); }

    function renderAll(){
      document.getElementById('totalStat').textContent = words.length;
      document.getElementById('correctStat').textContent = stats.correct;
      document.getElementById('wordCount').textContent = `${words.length} 个单词`;
      document.getElementById('wordList').innerHTML = words.length ? words.map(w => `
        <article class="word-row">
          <div class="word-main"><b>${escapeHtml(w.word)}</b><span>${escapeHtml(w.meaning)}</span></div>
          <div class="meter-wrap"><div class="meter-label"><span>掌握度</span><span>${w.mastery || 0}%</span></div><div class="meter"><i style="width:${w.mastery || 0}%"></i></div></div>
          <div class="row-actions"><button class="icon-btn refresh-btn" title="重新校准释义" aria-label="重新校准 ${escapeHtml(w.word)} 的释义" onclick="refreshMeaning('${w.id}')">↻</button><button class="icon-btn" aria-label="删除 ${escapeHtml(w.word)}" onclick="removeWord('${w.id}')">×</button></div>
        </article>`).join('') : '<p class="subcopy">储蓄罐还是空的，先存入一个单词吧。</p>';
      if (!current) renderStart();
    }

    function renderStart(){
      document.getElementById('roundLabel').textContent = words.length ? '准备开始' : '等待存词';
      document.getElementById('quizBody').innerHTML = `<div class="empty"><div><div class="jar" aria-hidden="true"><div class="coins"><span class="coin" style="--r:-8deg">A</span><span class="coin" style="--r:7deg">B</span><span class="coin" style="--r:-3deg">C</span><span class="coin" style="--r:9deg">D</span></div></div><h3>${words.length ? '让记忆开始复利' : '先存入你的第一个单词'}</h3><p>${words.length ? '随机抽一个语境，选出最合适的词填空。' : '有单词以后，就可以开始随机练习。'}</p><button class="primary" onclick="startQuiz()" ${words.length ? '' : 'disabled'}>开始练习</button></div></div>`;
    }

    function startQuiz(){
      if (!words.length) return showToast('先存入一个单词吧');
      round += 1; answered = false;
      current = words[Math.floor(Math.random()*words.length)];
      const distractors = shuffle(words.filter(w=>w.id!==current.id).map(w=>w.word));
      const extras = shuffle(fallbackWords.filter(w=>w.toLowerCase()!==current.word.toLowerCase()));
      const choices = shuffle([current.word, ...[...new Set([...distractors,...extras])].slice(0,3)]);
      const sentence = clozeSentence(current);
      document.getElementById('roundLabel').textContent = `第 ${round} 题`;
      document.getElementById('quizBody').innerHTML = `<div class="question-word"><small>根据中文提示，选出最合适的词填空</small><div class="word-line"><strong>${escapeHtml(current.meaning)}</strong></div></div><div class="cloze-card"><strong>${escapeHtml(sentence)}</strong><span>想一想这个词在句子里的语感</span></div><div class="choices">${choices.map((c,i)=>`<button class="choice" data-value="${escapeHtml(c)}" onclick="answer(this)"><span class="choice-letter">${String.fromCharCode(65+i)}</span><span>${escapeHtml(c)}</span></button>`).join('')}</div><div id="feedbackArea"></div>`;
    }

    function clozeSentence(item){
      const source=(item.example || `The best word for “${item.meaning}” is ${item.word}.`).trim();
      const escaped=item.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      const replaced=source.replace(new RegExp(`\\b${escaped}\\b`,'ig'),'_____');
      return replaced===source ? `${source}  _____` : replaced;
    }

    function answer(button){
      if (answered) return;
      answered = true; stats.total += 1;
      const selected = button.dataset.value;
      document.querySelectorAll('.choice').forEach(el => { el.disabled=true; if(el.dataset.value.toLowerCase()===current.word.toLowerCase()) el.classList.add('correct'); });
      if (selected.toLowerCase() === current.word.toLowerCase()){
        stats.correct += 1;
        current.mastery = Math.min(100, (current.mastery || 0) + 20);
        persist(); renderAll();
        document.getElementById('feedbackArea').innerHTML = `<div class="feedback"><div><b>答对了，掌握度 +20% ✨</b><span>${escapeHtml(current.example || '这枚单词硬币又亮了一点。')}</span></div><button class="next" onclick="startQuiz()">下一题 →</button></div>`;
      } else {
        button.classList.add('wrong'); persist(); renderAll(); setTimeout(renderMemory, 420);
      }
    }

    function renderMemory(){
      const q = encodeURIComponent(current.word.toLowerCase().replace(/[^a-z0-9 -]/g,''));
      const emoji = emojiMap[current.word.toLowerCase()] || '🧠';
      document.getElementById('quizBody').innerHTML = `<div class="memory"><div class="memory-head"><span class="oops">再看一眼，就会记得更牢</span><h3><span style="font-family:Georgia,serif">${escapeHtml(current.word)}</span> = ${escapeHtml(current.meaning)}</h3><p>把单词和画面绑在一起记忆。</p></div><div class="pictures">${[17,31,53].map(lock=>`<div class="picture"><div class="picture-fallback">${emoji}</div><img src="https://loremflickr.com/640/420/${q}?lock=${lock}" alt="与 ${escapeHtml(current.word)} 相关的记忆图片" loading="eager" onerror="this.style.display='none';this.previousElementSibling.style.display='grid'" /></div>`).join('')}</div><div class="memory-tip"><strong>${escapeHtml(current.example || current.word)}</strong><br>${current.example ? '读两遍例句，再想象刚才的画面。' : `试着用 “${escapeHtml(current.word)}” 说一个和图片有关的句子。`}</div><div class="memory-actions"><button class="secondary" onclick="speakWord()">🔊 再听一遍</button><button class="primary" onclick="startQuiz()">我记住了 →</button></div></div>`;
      speakWord();
    }

    function speakWord(){
      if (!current || !('speechSynthesis' in window)) return;
      speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(current.word); u.lang='en-US'; u.rate=.82; speechSynthesis.speak(u);
    }
    function removeWord(id){
      words = words.filter(w=>w.id!==id); if(current && current.id===id) current=null; persist(); renderAll(); showToast('已从储蓄罐移除');
    }
    function addWord(payload){
      const word = String(payload.word||'').trim(); const meaning=String(payload.meaning||'').trim(); const example=String(payload.example||'').trim();
      if(!word || !meaning) throw new Error('英文单词和中文意思都不能为空');
      if(words.some(w=>w.word.toLowerCase()===word.toLowerCase())) throw new Error('这个单词已经在储蓄罐里了');
      const item={ id:`w-${Date.now()}-${Math.random().toString(36).slice(2,7)}`, word, meaning, example, mastery:0 };
      words.unshift(item); persist(); renderAll(); return item;
    }
    async function loadDictionaryMeaning(rawWord){
      const word=String(rawWord||'').trim().toLowerCase();
      if(!/^[a-z][a-z '-]*$/.test(word)) return '';
      if(localMeanings[word]) return localMeanings[word];
      const bucket=word[0];
      if(!dictionaryBuckets.has(bucket)){
        const request=fetch(`./dict/${bucket}.json`,{cache:'force-cache'}).then(r=>r.ok?r.json():{}).catch(()=>({}));
        dictionaryBuckets.set(bucket,request);
      }
      const data=await dictionaryBuckets.get(bucket);
      return data[word] || '';
    }
    function fetchExampleInBackground(word, exampleEl){
      if(exampleEl.value.trim()) return;
      const controller=new AbortController(); const timer=setTimeout(()=>controller.abort(),1800);
      fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`,{signal:controller.signal})
        .then(r=>r.ok?r.json():[]).then(entries=>{
          const examples=(Array.isArray(entries)?entries:[]).flatMap(e=>(e.meanings||[]).flatMap(m=>(m.definitions||[]).map(d=>d.example))).filter(Boolean);
          if(examples[0] && !exampleEl.value.trim()) exampleEl.value=examples[0];
        }).catch(()=>{}).finally(()=>clearTimeout(timer));
    }
    async function autoFillMeaning(rawWord){
      const word=String(rawWord||'').trim(); const meaningEl=document.getElementById('meaningInput'); const exampleEl=document.getElementById('exampleInput'); const note=document.getElementById('lookupNote');
      if(!word || meaningEl.value.trim()) return meaningEl.value.trim();
      note.textContent='正在本地词典中查找…'; note.className='lookup-note busy';
      try {
        const meaning=await loadDictionaryMeaning(word);
        if(meaning && !meaningEl.value.trim()) meaningEl.value=meaning;
        if(meaningEl.value.trim()){ note.textContent='本地词典已填写，可按语境修改'; note.className='lookup-note ok'; fetchExampleInBackground(word,exampleEl); return meaningEl.value.trim(); }
        throw new Error('no translation');
      } catch {
        note.textContent='暂时没查到，请手动填写中文意思'; note.className='lookup-note'; return '';
      }
    }
    async function refreshMeaning(id){
      const item=words.find(w=>w.id===id); if(!item) return;
      showToast(`正在校准 “${item.word}”…`);
      const meaning=await loadDictionaryMeaning(item.word);
      if(!meaning) return showToast('本地词典暂未收录，可重新存入并手动修改');
      item.meaning=meaning; persist(); renderAll(); showToast(`已校准为：${meaning}`);
    }
    let lookupTimer;
    document.getElementById('wordInput').addEventListener('input',()=>{ clearTimeout(lookupTimer); const note=document.getElementById('lookupNote'); const meaning=document.getElementById('meaningInput'); meaning.value=''; note.textContent='输入完成后会立即查找'; note.className='lookup-note'; lookupTimer=setTimeout(()=>autoFillMeaning(document.getElementById('wordInput').value),180); });
    document.getElementById('wordInput').addEventListener('blur',()=>autoFillMeaning(document.getElementById('wordInput').value));
    document.getElementById('wordForm').addEventListener('submit', async e=>{
      e.preventDefault(); const button=document.getElementById('depositButton'); button.disabled=true; button.textContent='正在存入…';
      if(!document.getElementById('meaningInput').value.trim()) await autoFillMeaning(document.getElementById('wordInput').value);
      const data=new FormData(e.currentTarget);
      try { const item=addWord(Object.fromEntries(data)); e.currentTarget.reset(); document.getElementById('lookupNote').textContent='输入英文后按 Tab 或点击别处'; document.getElementById('lookupNote').className='lookup-note'; showToast(`“${item.word}” 已存入！`); document.getElementById('wordInput').focus(); }
      catch(err){ showToast(err.message); }
      finally { button.disabled=false; button.textContent='＋ 存进储蓄罐'; }
    });

    function registerWebMCP(){
      const context=document.modelContext; if(!context?.registerTool) return;
      const register=(tool)=>{ try { Promise.resolve(context.registerTool(tool)).catch(()=>{}); } catch{} };
      register({ name:'add_word', title:'存入单词', description:'把一个英文单词、中文意思和可选例句存进单词储蓄罐。', inputSchema:{ type:'object', properties:{ word:{type:'string'}, meaning:{type:'string'}, example:{type:'string'} }, required:['word','meaning'], additionalProperties:false }, annotations:{readOnlyHint:false,untrustedContentHint:true}, execute(input){ const item=addWord(input); showToast(`“${item.word}” 已存入！`); return {saved:true,word:item.word,mastery:0}; } });
      register({ name:'list_saved_words', title:'查看单词存款', description:'查看储蓄罐里的单词及当前掌握度。', inputSchema:{type:'object',properties:{},additionalProperties:false}, annotations:{readOnlyHint:true,untrustedContentHint:true}, execute(){ return {count:words.length,words:words.map(({word,meaning,mastery})=>({word,meaning,mastery}))}; } });
      register({ name:'start_random_quiz', title:'开始随机练习', description:'从现有单词中随机抽取一个并在页面上开始一道选择题。', inputSchema:{type:'object',properties:{},additionalProperties:false}, annotations:{readOnlyHint:false,untrustedContentHint:false}, execute(){ startQuiz(); return {started:true,round,word:current.word}; } });
    }
    renderAll(); registerWebMCP();
  </script>
</body>
</html>
