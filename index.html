<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>单词储蓄罐</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fbfaf4}#app{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="app" src="./app.html" title="单词储蓄罐"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  const win=frame.contentWindow,doc=frame.contentDocument;
  if(!win||!doc)return;

  const style=doc.createElement('style');
  style.textContent=`
    #wordList .word-main{cursor:pointer;border-radius:9px;transition:.15s ease}
    #wordList .word-main:hover,#wordList .word-main:focus-visible{background:var(--mint);outline:none}
    #wordList .word-main b::after{content:'  🔊';font-family:system-ui,sans-serif;font-size:.78rem;opacity:.55}
    .memory .picture{position:relative;background:linear-gradient(145deg,var(--mint),#fff7d7)}
    .memory .picture img.memory-wiki-image{width:100%;height:100%;object-fit:cover;display:block}
    .memory-visual-card{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:14px;background:linear-gradient(145deg,var(--mint),#fff5c9);color:var(--ink)}
    .memory-visual-card .memory-emoji{font-size:2.7rem;line-height:1;margin-bottom:7px}
    .memory-visual-card b{display:block;font-family:Georgia,serif;font-size:1.05rem;word-break:break-word}
    .memory-visual-card small{display:block;margin-top:5px;color:var(--muted);font-size:.72rem;line-height:1.35}
    .memory-source{position:absolute;right:6px;bottom:6px;background:rgba(25,54,54,.78);color:#fff;border-radius:999px;padding:3px 7px;font-size:.58rem;letter-spacing:.02em}
  `;
  doc.head.appendChild(style);

  const enhance=()=>doc.querySelectorAll('#wordList .word-main').forEach(el=>{
    if(el.dataset.speakReady)return;
    el.dataset.speakReady='1';
    el.setAttribute('role','button');
    el.tabIndex=0;
    const word=el.querySelector('b')?.textContent?.trim()||'';
    el.title=word?`点击朗读 ${word}`:'点击朗读';
    el.setAttribute('aria-label',word?`朗读 ${word}`:'朗读单词');
  });

  const speak=el=>{
    const word=el?.querySelector('b')?.textContent?.trim();
    if(!word||!('speechSynthesis' in win))return;
    win.speechSynthesis.cancel();
    const u=new win.SpeechSynthesisUtterance(word);
    u.lang='en-US';
    u.rate=.82;
    win.speechSynthesis.speak(u);
  };

  doc.addEventListener('click',e=>{
    const el=e.target.closest?.('#wordList .word-main');
    if(el)speak(el);
  });
  doc.addEventListener('keydown',e=>{
    const el=e.target.closest?.('#wordList .word-main');
    if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();speak(el);}
  });

  const list=doc.getElementById('wordList');
  if(list){enhance();new win.MutationObserver(enhance).observe(list,{childList:true,subtree:true});}

  const emojiFor=(word,meaning)=>{
    const text=`${word} ${meaning}`.toLowerCase();
    const known={curious:'🔎',harvest:'🌾',whisper:'🤫',resilient:'🌱',glimpse:'👀',nourish:'🥣',apple:'🍎',book:'📚',car:'🚗',dog:'🐕',cat:'🐈',bird:'🐦',tree:'🌳',flower:'🌸',water:'💧',house:'🏠',school:'🏫',money:'💰',time:'⏰',food:'🍽️',computer:'💻',phone:'📱'};
    if(known[word.toLowerCase()])return known[word.toLowerCase()];
    const rules=[
      [/动物|狗|猫|鸟|鱼|horse|animal|pet/,'🐾'],
      [/植物|树|花|草|森林|plant|tree|flower|forest/,'🌿'],
      [/水果|食物|食品|吃|饮|fruit|food|meal|drink/,'🍎'],
      [/汽车|车辆|交通|火车|飞机|船|car|vehicle|train|plane|ship/,'🚗'],
      [/房|建筑|学校|城市|国家|地点|house|building|school|city|country|place/,'🗺️'],
      [/书|阅读|学习|知识|study|learn|book|read/,'📚'],
      [/钱|经济|金融|money|finance|bank/,'💰'],
      [/时间|日期|time|date|hour|minute/,'⏰'],
      [/身体|器官|健康|body|health|heart|brain/,'🫀'],
      [/快乐|悲伤|焦虑|害怕|情绪|感觉|happy|sad|anxiety|fear|emotion|feel/,'💭']
    ];
    return rules.find(([re])=>re.test(text))?.[1]||'🧠';
  };

  const normalize=s=>String(s||'').toLowerCase().replace(/\([^)]*\)/g,'').replace(/[^a-z0-9]+/g,' ').trim();
  const looksAbstract=(word,meaning)=>{
    const w=String(word||'').toLowerCase();
    const m=String(meaning||'');
    if(/(?:tion|sion|ness|ity|ment|ism|ance|ence|ship|hood|acy|dom)$/.test(w))return true;
    if(/(^|[；;，,\s])(a|adj|adv|v|vt|vi)\./i.test(m))return true;
    if(/的(?:[；;，,]|$)/.test(m)&&!/(^|[；;，,\s])n\./i.test(m))return true;
    return false;
  };

  const makeCard=(tile,word,meaning,emoji,label='概念记忆卡')=>{
    tile.replaceChildren();
    const card=doc.createElement('div');
    card.className='memory-visual-card';
    const icon=doc.createElement('div');icon.className='memory-emoji';icon.textContent=emoji;
    const b=doc.createElement('b');b.textContent=word;
    const small=doc.createElement('small');small.textContent=meaning||label;
    card.append(icon,b,small);
    tile.appendChild(card);
  };

  const findReliableWikiImage=async word=>{
    const url=new URL('https://en.wikipedia.org/w/api.php');
    const params={action:'query',format:'json',formatversion:'2',generator:'prefixsearch',gpssearch:word,gpslimit:'6',prop:'pageimages|pageterms',piprop:'thumbnail',pithumbsize:'640',pilimit:'6',wbptterms:'description',redirects:'1',origin:'*'};
    Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
    const response=await win.fetch(url.toString(),{mode:'cors',cache:'force-cache'});
    if(!response.ok)throw new Error('wiki');
    const data=await response.json();
    const target=normalize(word);
    const pages=(data?.query?.pages||[]).sort((a,b)=>(a.index??999)-(b.index??999));
    return pages.find(page=>{
      if(!page?.thumbnail?.source)return false;
      const title=normalize(page.title);
      return title===target;
    })||null;
  };

  const improveMemoryVisuals=async()=>{
    const memory=doc.querySelector('.memory');
    const word=memory?.querySelector('.memory-head h3 span')?.textContent?.trim()||'';
    const heading=memory?.querySelector('.memory-head h3')?.textContent||'';
    const meaning=heading.includes('=')?heading.slice(heading.indexOf('=')+1).trim():'';
    const tiles=[...doc.querySelectorAll('.memory .pictures .picture')];
    if(!word||!tiles.length)return;

    const emoji=emojiFor(word,meaning);
    tiles.forEach((tile,i)=>makeCard(tile,word,meaning,emoji,i===0?'正在匹配可靠图片…':'概念记忆卡'));

    if(looksAbstract(word,meaning))return;
    try{
      const page=await findReliableWikiImage(word);
      if(!page?.thumbnail?.source)return;
      const tile=tiles[0];
      tile.replaceChildren();
      const img=doc.createElement('img');
      img.className='memory-wiki-image';
      img.src=page.thumbnail.source;
      img.alt=`${word} 的百科相关图片`;
      img.loading='eager';
      img.referrerPolicy='no-referrer';
      img.onerror=()=>makeCard(tile,word,meaning,emoji);
      const source=doc.createElement('span');source.className='memory-source';source.textContent='Wikipedia';
      tile.append(img,source);
    }catch{}
  };

  if(typeof win.renderMemory==='function'){
    const originalRenderMemory=win.renderMemory;
    win.renderMemory=function(...args){
      const result=originalRenderMemory.apply(this,args);
      Promise.resolve().then(improveMemoryVisuals);
      return result;
    };
  }
});
</script>
</body>
</html>
