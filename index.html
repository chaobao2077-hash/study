<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>单词储蓄罐</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fbfaf4}#app{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="app" src="./app.html" title="单词储蓄罐"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  const win=frame.contentWindow,doc=frame.contentDocument;
  if(!win||!doc)return;

  const style=doc.createElement('style');
  style.textContent=`
    #wordList .word-main{cursor:pointer;border-radius:9px;transition:.15s ease}
    #wordList .word-main:hover,#wordList .word-main:focus-visible{background:var(--mint);outline:none}
    #wordList .word-main b::after{content:'  🔊';font-family:system-ui,sans-serif;font-size:.78rem;opacity:.55}
    .memory .pictures{grid-template-columns:repeat(3,1fr)!important}
    .memory .picture{position:relative!important;background:linear-gradient(145deg,var(--mint),#fff5c9)!important;overflow:hidden!important}
    .memory .picture>img,.memory .picture>.picture-fallback{display:none!important}
    .semantic-card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px;color:var(--ink);background:linear-gradient(145deg,var(--mint),#fff5c9)}
    .semantic-card .icon{font-size:2.45rem;line-height:1;margin-bottom:8px}
    .semantic-card b{display:block;font-family:Georgia,serif;font-size:1.05rem;line-height:1.25;word-break:break-word}
    .semantic-card span{display:block;margin-top:6px;color:var(--muted);font-size:.72rem;line-height:1.35;max-width:100%;word-break:break-word}
    .semantic-card.example b,.semantic-card.method b{font-family:inherit;font-size:.82rem}
    .semantic-card.example span{font-family:Georgia,serif;color:var(--ink)}
    .memory-actions{position:relative;z-index:5}
    @media(max-width:520px){.memory .pictures{grid-template-columns:1fr 1fr!important}.memory .picture:last-child{display:none!important}}
  `;
  doc.head.appendChild(style);

  const enhanceWords=()=>doc.querySelectorAll('#wordList .word-main').forEach(el=>{
    if(el.dataset.speakReady)return;
    el.dataset.speakReady='1';
    el.setAttribute('role','button');
    el.tabIndex=0;
    const word=el.querySelector('b')?.textContent?.trim()||'';
    el.title=word?`点击朗读 ${word}`:'点击朗读';
    el.setAttribute('aria-label',word?`朗读 ${word}`:'朗读单词');
  });

  const speak=el=>{
    const word=el?.querySelector('b')?.textContent?.trim();
    if(!word||!('speechSynthesis' in win))return;
    win.speechSynthesis.cancel();
    const u=new win.SpeechSynthesisUtterance(word);
    u.lang='en-US';u.rate=.82;win.speechSynthesis.speak(u);
  };

  doc.addEventListener('click',e=>{
    const el=e.target.closest?.('#wordList .word-main');
    if(el)speak(el);
  });
  doc.addEventListener('keydown',e=>{
    const el=e.target.closest?.('#wordList .word-main');
    if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();speak(el);}
  });

  const emojiFor=(word,meaning)=>{
    const text=`${word} ${meaning}`.toLowerCase();
    const known={curious:'🔎',harvest:'🌾',whisper:'🤫',resilient:'🌱',glimpse:'👀',nourish:'🥣',apple:'🍎',book:'📚',car:'🚗',dog:'🐕',cat:'🐈',bird:'🐦',tree:'🌳',flower:'🌸',water:'💧',house:'🏠',school:'🏫',money:'💰',time:'⏰',food:'🍽️',computer:'💻',phone:'📱'};
    if(known[word.toLowerCase()])return known[word.toLowerCase()];
    const rules=[
      [/动物|狗|猫|鸟|鱼|horse|animal|pet/,'🐾'],[/植物|树|花|草|森林|plant|tree|flower|forest/,'🌿'],
      [/水果|食物|食品|吃|饮|fruit|food|meal|drink/,'🍎'],[/汽车|车辆|交通|火车|飞机|船|car|vehicle|train|plane|ship/,'🚗'],
      [/房|建筑|学校|城市|国家|地点|house|building|school|city|country|place/,'🗺️'],[/书|阅读|学习|知识|study|learn|book|read/,'📚'],
      [/钱|经济|金融|money|finance|bank/,'💰'],[/时间|日期|time|date|hour|minute/,'⏰'],
      [/身体|器官|健康|body|health|heart|brain/,'🫀'],[/快乐|悲伤|焦虑|害怕|情绪|感觉|happy|sad|anxiety|fear|emotion|feel/,'💭']
    ];
    return rules.find(([re])=>re.test(text))?.[1]||'🧠';
  };

  const addCard=(tile,cls,icon,title,text)=>{
    if(!tile||tile.dataset.semanticReady==='1')return;
    tile.dataset.semanticReady='1';
    tile.replaceChildren();
    const card=doc.createElement('div');card.className=`semantic-card ${cls||''}`;
    const i=doc.createElement('div');i.className='icon';i.textContent=icon;
    const b=doc.createElement('b');b.textContent=title;
    const s=doc.createElement('span');s.textContent=text;
    card.append(i,b,s);tile.appendChild(card);
  };

  let renderingCards=false;
  const replaceMemoryPictures=()=>{
    if(renderingCards)return;
    const memory=doc.querySelector('.memory');
    const tiles=[...doc.querySelectorAll('.memory .pictures .picture')];
    if(!memory||!tiles.length||tiles.every(t=>t.dataset.semanticReady==='1'))return;
    renderingCards=true;
    try{
      const word=memory.querySelector('.memory-head h3 span')?.textContent?.trim()||'';
      const heading=memory.querySelector('.memory-head h3')?.textContent||'';
      const meaning=heading.includes('=')?heading.slice(heading.indexOf('=')+1).trim():'';
      const example=memory.querySelector('.memory-tip strong')?.textContent?.trim()||'';
      const emoji=emojiFor(word,meaning);
      addCard(tiles[0],'',emoji,word,meaning||'记住这个词义');
      addCard(tiles[1],'example','💬','例句场景',example&&example!==word?example:`试着用 ${word} 说一个简单句子`);
      addCard(tiles[2],'method','🧩','三步记忆','先读英文 → 想中文义 → 再读例句');
    }finally{renderingCards=false;}
  };

  const wordList=doc.getElementById('wordList');
  if(wordList){enhanceWords();new win.MutationObserver(enhanceWords).observe(wordList,{childList:true,subtree:true});}

  const quizBody=doc.getElementById('quizBody');
  if(quizBody){
    const observer=new win.MutationObserver(()=>{
      if(doc.querySelector('.memory .pictures .picture:not([data-semantic-ready="1"])')){
        win.requestAnimationFrame(replaceMemoryPictures);
      }
    });
    observer.observe(quizBody,{childList:true,subtree:true});
    replaceMemoryPictures();
  }
});
</script>
</body>
</html>
