<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>单词储蓄罐</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fbfaf4}#app{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="app" src="./app.html" title="单词储蓄罐"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  const win=frame.contentWindow,doc=frame.contentDocument;
  if(!win||!doc)return;
  const style=doc.createElement('style');
  style.textContent=`#wordList .word-main{cursor:pointer;border-radius:9px;transition:.15s ease}#wordList .word-main:hover,#wordList .word-main:focus-visible{background:var(--mint);outline:none}#wordList .word-main b::after{content:'  🔊';font-family:system-ui,sans-serif;font-size:.78rem;opacity:.55}`;
  doc.head.appendChild(style);
  const enhance=()=>doc.querySelectorAll('#wordList .word-main').forEach(el=>{
    if(el.dataset.speakReady)return;
    el.dataset.speakReady='1';
    el.setAttribute('role','button');
    el.tabIndex=0;
    const word=el.querySelector('b')?.textContent?.trim()||'';
    el.title=word?`点击朗读 ${word}`:'点击朗读';
    el.setAttribute('aria-label',word?`朗读 ${word}`:'朗读单词');
  });
  const speak=el=>{
    const word=el?.querySelector('b')?.textContent?.trim();
    if(!word||!('speechSynthesis' in win))return;
    win.speechSynthesis.cancel();
    const u=new win.SpeechSynthesisUtterance(word);
    u.lang='en-US';
    u.rate=.82;
    win.speechSynthesis.speak(u);
  };
  doc.addEventListener('click',e=>{
    const el=e.target.closest?.('#wordList .word-main');
    if(el)speak(el);
  });
  doc.addEventListener('keydown',e=>{
    const el=e.target.closest?.('#wordList .word-main');
    if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();speak(el);}
  });
  const list=doc.getElementById('wordList');
  if(list){enhance();new win.MutationObserver(enhance).observe(list,{childList:true,subtree:true});}
});
</script>
</body>
</html>
